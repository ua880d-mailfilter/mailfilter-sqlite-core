name: core-ci

on:
  push:
    branches: [ "main", "master" ]
  pull_request:

jobs:
  build-core:
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Build-Werkzeuge installieren
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build build-essential pkg-config flex bison libfl-dev libsqlite3-dev

      - name: Build-Verzeichnis neu erzeugen
        run: |
          rm -rf build
          cmake -S . -B build -G Ninja

      - name: Core bauen
        run: cmake --build build --verbose

      - name: Build-Artefakte hochladen
        uses: actions/upload-artifact@v4
        with:
          name: core-build-linux
          path: |
            build

      - name: Create CRLF variant of sample mailheader log
        run: |
          python3 - <<'PY'
          from pathlib import Path
          src = Path("tests/data/sample-mailheader.log")
          dst = Path("build/sample-mailheader-crlf.log")
          text = src.read_text(encoding="utf-8")
          text = text.replace("\r\n", "\n").replace("\r", "\n")
          dst.write_bytes(text.replace("\n", "\r\n").encode("utf-8"))
          PY

      - name: Smoke-Test Import
        run: |
          ./build/import_smoke_test

      - name: Dump smoke test database summary
        run: |
          sqlite3 build/test-import.sqlite3 "SELECT 'MESSAGES', COUNT(*) FROM MESSAGES;" > build/test-import-summary.txt
          sqlite3 build/test-import.sqlite3 "SELECT 'HEADER_ENTRIES', COUNT(*) FROM HEADER_ENTRIES;" >> build/test-import-summary.txt
          sqlite3 build/test-import.sqlite3 "SELECT msg_log_id, message_id, subject FROM MESSAGES ORDER BY msg_log_id LIMIT 5;" >> build/test-import-summary.txt

      - name: Upload smoke test database
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-db
          path: |
            build/test-import.sqlite3
            build/test-import-crlf.sqlite3

      - name: Upload smoke test summary
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-summary
          path: |
            build/test-import-summary.txt
