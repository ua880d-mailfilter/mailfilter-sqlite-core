name: core-ci

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ libsqlite3-dev

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja

      - name: Build
        run: |
          cmake --build build
