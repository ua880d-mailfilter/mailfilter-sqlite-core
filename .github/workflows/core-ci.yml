name: core-ci

on:
  push:
    branches: [ "main", "master" ]
  pull_request:

jobs:
  build-core:
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Build-Werkzeuge installieren
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build build-essential pkg-config flex bison libfl-dev libsqlite3-dev

      - name: Build-Verzeichnis neu erzeugen
        run: |
          rm -rf build
          cmake -S . -B build -G Ninja

      - name: Core bauen
        run: cmake --build build --verbose

      - name: Build-Artefakte hochladen
        uses: actions/upload-artifact@v4
        with:
          name: core-build-linux
          path: |
            build

      - name: Smoke-Test Import
        run: |
          ./build/import_smoke_test
